---
# tasks file for nginx
- name: create nginx volume and secrets folder
  ansible.builtin.file:
    path: "{{ item }}"
    owner: deployer
    group: deployer
    state: directory
    mode: "0755"
  loop:
    - /opt/app/nginx
    - /opt/app/nginx/conf
    - /opt/app/nginx/conf/cert
    - /opt/app/mkcert-ca
    - /usr/local/share/ca-certificates

- name: copy nginx conf file
  ansible.builtin.copy:
    src: ./
    dest: /opt/app/nginx/
    owner: deployer
    group: deployer
    mode: "0755"
  notify:
    - remove old Nginx image
    - trigger Nginx build
    - trigger_compose_refresh

- name: Install mkcert CA to a custom directory
  ansible.builtin.shell: 
    cmd:  mkcert -install
    creates: "/opt/app/mkcert-ca/rootCA.pem"
  environment:
    CAROOT: "/opt/app/mkcert-ca"

- name: Create a self-trusted cert with mkcert
  ansible.builtin.shell:
    cmd: "mkcert -key-file /opt/app/nginx/conf/cert/secret.key \
        -cert-file /opt/app/nginx/conf/cert/secret.crt \
        localhost {{ ansible_host }}"
    creates: /opt/app/nginx/conf/cert/secret.key
  environment:
    CAROOT: "/opt/app/mkcert-ca"
  notify:
    - remove old Nginx image
    - trigger Nginx build
    - trigger_compose_refresh

- name: update cert permissions and ownership
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: deployer
    group: deployer
    mode: "{{ item.mode }}"
  loop:
    - { path: "/opt/app/nginx/conf/cert/secret.key", mode: "0600" }
    - { path: "/opt/app/nginx/conf/cert/secret.crt", mode: "0644" }

- name: deploy nginx configuration
  ansible.builtin.template:
    src: conf/1337.conf.j2
    dest: /opt/app/nginx/conf/1337.conf
    owner: deployer
    group: deployer
    mode: "0755"
  notify:
    - remove old Nginx image
    - trigger Nginx build
    - trigger_compose_refresh
