---
# tasks file for nginx
- name: create nginx volume and secrets folder
  ansible.builtin.file:
    path: "{{ item }}"
    owner: deployer
    group: deployer
    state: directory
    mode: "0755"
  loop:
    - /opt/app/nginx
    - /opt/app/nginx/conf
    - /opt/app/nginx/conf/certs

- name: copy nginx conf file
  ansible.builtin.copy:
    src: ./
    dest: /opt/app/nginx/
    owner: deployer
    group: deployer
    mode: "0755"

- name: build nginx image
  community.docker.docker_image_build:
    name: nginx
    tag: 1337-1.0
    path: /opt/app/nginx/
    exports:
      - type: image
