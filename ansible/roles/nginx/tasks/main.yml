---
# tasks file for nginx
- name: create nginx volume and secrets folder
  ansible.builtin.file:
    path: "{{ item }}"
    owner: deployer
    group: deployer
    state: directory
    mode: "0755"
  loop:
    - /opt/app/nginx
    - /opt/app/nginx/conf
    - /opt/app/nginx/conf/certs

- name: copy nginx conf file
  ansible.builtin.copy:
    src: ./
    dest: /opt/app/nginx/
    owner: deployer
    group: deployer
    mode: "0755"
  notify:
    - remove old Nginx image
    - trigger Nginx build
    - trigger_compose_refresh

- name: deploy nginx configuration
  ansible.builtin.template:
    src: conf/1337.conf.j2
    dest: /opt/app/nginx/conf/1337.conf
    owner: deployer
    group: deployer
    mode: "0755"
  notify:
    - remove old Nginx image
    - trigger Nginx build
    - trigger_compose_refresh
