---
- name: Ensure remote_tmp exists with correct permissions
  ansible.builtin.file:
    path: "/tmp/.ansible-root/tmp"
    state: directory
    mode: '0751'
    owner: root
    group: root
    
- name: download docker installation script
  ansible.builtin.get_url:
    url: https://get.docker.com/
    dest: /tmp/get-docker.sh
    mode: "0755"

- name: execute the docker installation script
  ansible.builtin.shell: 
    cmd: /tmp/get-docker.sh 
    creates: /usr/bin/docker

- name: Configure Docker daemon DNS
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "dns": ["8.8.8.8", "1.1.1.1"]
      }
    owner: root
    group: root
    mode: "0644"
  notify: restart docker service

- name: start and enable docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: Ensure docker group is created
  ansible.builtin.group:
    name: docker
    state: present
