---
# tasks file for mysql
- name: create mysql volume and secrets folder
  ansible.builtin.file:
    path: "{{ item }}"
    owner: deployer
    group: deployer
    state: directory
    mode: "0755"
  loop:
    - /opt/app/mysql
    - /opt/app/mysql/data
    - /opt/app/mysql/secrets

- name: copy mysql secrets
  ansible.builtin.copy:
    src: secrets/
    dest: /opt/app/mysql/secrets/
    owner: deployer
    group: deployer
    mode: "0755"

- name: pull mysql image
  community.docker.docker_image_pull:
    name: mysql
    tag: "9.7.2"
    pull: not_present
