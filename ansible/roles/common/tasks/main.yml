---
# tasks file for common
- name: install openssl
  ansible.builtin.package:
    name: openssl
    state: present

- name: Install required Python libraries for Docker modules
  ansible.builtin.package:
    name: python3-requests
    state: present
    update_cache: yes

- name: Install ACL package for Ansible unprivileged user switching
  ansible.builtin.package:
    name: acl
    state: present
    update_cache: yes

- name: add a deployer user
  ansible.builtin.user:
    name: deployer
    shell: /bin/bash
    groups: docker
    append: yes

- name: reset SSH connection to load docker group
  ansible.builtin.meta: reset_connection

- name: create app folder
  ansible.builtin.file:
    path: "/opt/app"
    owner: deployer
    group: deployer
    state: directory
    mode: "0755"

- name: Prune old docker build caches to free space
  community.docker.docker_prune:
    builder_cache: yes
    images: yes
    images_filters:
      dangling: false
