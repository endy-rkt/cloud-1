---
# tasks file for wordpress
- name: create wordpress volume folder
  ansible.builtin.file:
    path: "{{ item }}"
    owner: deployer
    group: deployer
    state: directory
    mode: "0755"
  loop:
    - /opt/app/wordpress
    - /opt/app/wordpress/conf
    - /opt/app/wordpress/data
    - /opt/app/wordpress/secrets

- name: copy wordpress conf file
  ansible.builtin.copy:
    src: ./
    dest: /opt/app/wordpress/
    owner: deployer
    group: deployer
    mode: "0755"

- name: load Ansible Vault variables
  ansible.builtin.include_vars:
    file: secrets.yaml

- name: write secret file from Vault variable(wp_admin_pass)
  ansible.builtin.copy:
    content: "{{ wp_admin_pass }}"
    dest: "/opt/app/wordpress/secrets/wp_admin_pass.txt"
    mode: "0400"
    owner: deployer
    group: deployer
  no_log: true
  notify:
    - trigger_compose_stop
    - remove_db_volume_folder
    - recreate_db_volume_folder
    - remove_wp_volume_folder
    - recreate_wp_volume_folder
    - trigger_compose_restart

- name: write secret file from Vault variable(wp_user_pass)
  ansible.builtin.copy:
    content: "{{ wp_user_pass }}"
    dest: "/opt/app/wordpress/secrets/wp_user_pass.txt"
    mode: "0400"
    owner: deployer
    group: deployer
  no_log: true
  notify:
    - trigger_compose_stop
    - remove_db_volume_folder
    - recreate_db_volume_folder
    - remove_wp_volume_folder
    - recreate_wp_volume_folder
    - trigger_compose_restart

- name: deploy wordpress configuration
  ansible.builtin.template:
    src: conf/entrypoint.sh.j2
    dest: /opt/app/wordpress/conf/entrypoint.sh
    owner: deployer
    group: deployer
    mode: "0755"
  notify:
    - trigger_compose_stop
    - remove_db_volume_folder
    - recreate_db_volume_folder
    - remove_wp_volume_folder
    - recreate_wp_volume_folder
    - trigger_compose_restart