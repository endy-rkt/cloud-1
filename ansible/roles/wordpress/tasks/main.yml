---
# tasks file for wordpress
- name: create wordpress volume and secrets folder
  ansible.builtin.file:
    path: "{{ item }}"
    owner: deployer
    group: deployer
    state: directory
    mode: "0755"
  loop:
    - /opt/app/wordpress
    - /opt/app/wordpress/conf
    - /opt/app/wordpress/data
    - /opt/app/wordpress/secrets

- name: copy wordpress conf file
  ansible.builtin.copy:
    src: ./
    dest: /opt/app/wordpress/
    owner: deployer
    group: deployer
    mode: "0755"

