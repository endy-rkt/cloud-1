---
# handlers file for wordpress
- name: remove old wordpress image
  community.docker.docker_image:
    name: wordpress:1337-1.0
    state: absent
    force_absent: yes
  failed_when: false

- name: trigger wordpress build
  community.docker.docker_image_build:
    name: wordpress
    tag: 1337-1.0
    path: /opt/app/wordpress/
    outputs:
      - type: docker
        push: false