---
# handlers file for nginx
- name: remove wp volume folder
  ansible.builtin.file:
    path: /opt/app/wordpress/data
    state: absent
  listen: remove_wp_volume_folder

- name: recreate wp volume folder
  ansible.builtin.file:
    path: /opt/app/wordpress/data
    owner: deployer
    group: deployer
    state: directory
    mode: "0755"
  listen: recreate_wp_volume_folder
 