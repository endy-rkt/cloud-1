services:
  nginx:
    image: nginx:1337-1.0
    build: nginx/.
    container_name: nginx
    ports:
        - "80:80"
        - "443:443"
    networks:
        - inception
    volumes:
        - wp_data:/var/www/html
        - phpmyadmin_data:/var/www/admin
    healthcheck:
        test: ["CMD", "curl", "http://localhost"]
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 10s
    depends_on:
      wordpress:
        condition: service_healthy
    restart: unless-stopped

  wordpress:
    image: wordpress:1337-1.0
    build: wordpress/.
    container_name: wordpress
    env_file:
        - .env
    environment:
        WORDPRESS_DB_HOST: mysql
        WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_user_pass
    secrets:
        - db_user_pass
        - wp_user_pass
        - wp_admin_pass
    networks:
        - inception
    volumes:
        - wp_data:/var/www/html
    healthcheck:
        test: ["CMD-SHELL", "netstat -an | grep :9000 | grep LISTEN"]
        interval: 10s
        timeout: 5s
        retries: 3
        start_period: 5s
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:9.7.2
    container_name: mysql
    env_file:
        - .env
    environment:
        MYSQL_PASSWORD_FILE: /run/secrets/db_user_pass
        MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_pass
    secrets:
        - db_user_pass
        - db_root_pass
    networks:
        - inception
    volumes:
        - db_data:/var/lib/mysql
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5-fpm-alpine
    container_name: phpmyadmin
    environment:
        PMA_HOST: mysql
    networks:
        - inception
    volumes:
        - phpmyadmin_data:/var/www/html
    healthcheck:
        test: ["CMD-SHELL", "netstat -an | grep :9000 | grep LISTEN"]
        interval: 10s
        timeout: 5s
        retries: 3
        start_period: 5s
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

networks:
    inception:

volumes:
    wp_data:
        name: "wordpress-data"
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/opt/app/wordpress/data"
    
    phpmyadmin_data:
        name: "phpmyadmin-data"
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/opt/app/phpmyadmin/data"

    db_data:
        name: "db-data"
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/opt/app/mysql/data"

secrets:
    db_user_pass:
        file: /opt/app/mysql/secrets/db_user_pass.txt
    db_root_pass:
        file: /opt/app/mysql/secrets/db_root_pass.txt
    wp_user_pass:
        file: /opt/app/wordpress/secrets/wp_user_pass.txt
    wp_admin_pass:
        file: /opt/app/wordpress/secrets/wp_admin_pass.txt
