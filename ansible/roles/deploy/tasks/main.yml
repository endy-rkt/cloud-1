---
# tasks file for deploy
- name: copy docker compose and env file
  ansible.builtin.copy:
    src: ./
    dest: /opt/app/
    owner: deployer
    group: deployer
    mode: "0755"

- name: launch docker compose
  become: yes
  become_user: deployer
  community.docker.docker_compose_v2:
    project_src: /opt/app/
    build: always
    state: present
