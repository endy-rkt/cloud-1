---
# tasks file for iptable
- name: install iptable
  ansible.builtin.package:
    name: iptables
    state: present

- name: install iptables-persistent
  ansible.builtin.package:
    name: iptables-persistent
    state: present

- name: start and enable iptables service
  ansible.builtin.service:
    name: iptables
    state: started
    enabled: yes

- name: Allow local loopback traffic
  ansible.builtin.iptables:
    chain: INPUT
    in_interface: lo
    jump: ACCEPT
    rule_num: 1

- name: Allow related and established connections
  ansible.builtin.iptables:
    chain: INPUT
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT
    rule_num: 2

- name: allow on autorized ports
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_ports:
      - "22"
      - "80"
      - "443"
    rule_num: 3
    jump: ACCEPT
  notify: save iptables rules

- name: drop all non autorized connextion
  ansible.builtin.iptables:
    chain: INPUT
    rule_num: 4
    jump: DROP
  notify: save iptables rules
