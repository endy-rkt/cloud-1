services:
  nginx:
    image: nginx:1-alpine3.24
    container_name: nginx
    ports:
        - "80:80"
        - "443:443"
    networks:
        - inception
    volumes:
        - wp_data:/var/www/html
        - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf
    healthcheck:
        test: ["CMD", "curl", "http://localhost"]
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 10s
    restart: unless-stopped

  wordpress:
    image: wordpress:php8.4-fpm-alpine
    container_name: wordpress
    environment:
        WORDPRESS_DB_HOST: mysql
        WORDPRESS_DB_USER: trazanad
        WORDPRESS_DB_PASSWORD: trazanad
        WORDPRESS_DB_NAME: wp_db
    networks:
        - inception
    volumes:
        - wp_data:/var/www/html
    healthcheck:
        test: ["CMD-SHELL", "netstat -an | grep :9000 | grep LISTEN"]
        interval: 10s
        timeout: 5s
        retries: 3
        start_period: 5s
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:9.7.2
    container_name: mysql
    environment:
        MYSQL_DATABASE: wp_db
        MYSQL_USER: trazanad
        MYSQL_PASSWORD: trazanad
        MYSQL_ROOT_PASSWORD: password
    networks:
        - inception
    volumes:
        - db_data:/var/lib/mysql
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5-fpm-alpine
    container_name: phpmyadmin
    networks:
        - inception
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

networks:
    inception:

volumes:
    wp_data:
        name: "wordpress-data"
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/home/trazanad/data/wordpress"
    db_data:
        name: "db-data"
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/home/trazanad/data/db"
