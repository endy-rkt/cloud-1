services:
  debian:
    build:
      context: .
      dockerfile: debian/Dockerfile
    image: debian:ssh-1
    container_name: debian-ssh
    ports: 
      - 2231:22
    restart: unless-stopped
  
  alpine:
    build:
      context: .
      dockerfile: alpine/Dockerfile
    image: alpine:ssh-1
    container_name: alpine-ssh
    ports: 
      - 2230:22
    restart: unless-stopped
    