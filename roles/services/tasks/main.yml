- name: Copy docker compose file
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: /opt/app/

- name: copy env file
  ansible.builtin.copy:
    src: .env
    dest: /opt/app

- name: Copy secrets
  ansible.builtin.copy:
    src: ./secrets
    dest: /opt/app/

- name: Start services
  community.docker.docker_compose_v2:
    project_src: /opt/app