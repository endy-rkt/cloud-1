- name: Create Duckdns directory
  ansible.builtin.file:
    path: /opt/app/duckdns
    state: directory


- name: Copy Dockerfile
  ansible.builtin.copy:
    src: Dockerfile
    dest: /opt/app/duckdns/Dockerfile

- name: Copy script
  ansible.builtin.copy:
    src: entrypoint.sh
    dest: /opt/app/duckdns/entrypoint.sh
